name: project-checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install reproduced direct dependencies
        run: python -m pip install -r requirements-reproducible.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q app.py release_check.py src recommendation_training tests
      - name: Model smoke test
        run: python -m recommendation_training.smoke_test
      - name: Release check with documented fallback
        run: python release_check.py
